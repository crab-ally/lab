version: "3.8"

services:

  # ===========================================================================
  # ROBOT CORE
  #   - robot
  # 실행
  #   - docker compose up robot
  #   - docker compose exec robot bash
  # ===========================================================================

  robot:
    build:
      context: .
      target: robot
    container_name: safety_patrol_robot
    stdin_open: true
    tty: true
    ipc: host

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspace/ros2_ws/install/setup.bash &&
      ros2 launch /workspace/launch/robot_state_publisher.launch.py &
      python3 /workspace/scripts/twist_mux_node.py --ros-args -p use_sim_time:=true &
      python3 /workspace/scripts/mujoco_ros2_bridge.py &
      wait"

    volumes:
      - ./models:/workspace/models
      - ./worlds:/workspace/worlds
      - ./scenes:/workspace/scenes
      - ./scripts:/workspace/scripts
      - ./config:/workspace/config
      - ./maps:/workspace/maps
      - ./data:/workspace/data
      - ./results:/workspace/results
      - ./datasets:/workspace/datasets
      - ./ros2_ws:/workspace/ros2_ws
      - ./urdf:/workspace/urdf
      - ./launch:/workspace/launch

    environment:
      - DISPLAY=host.docker.internal:0.0
      - LIBGL_ALWAYS_SOFTWARE=0
      - QT_X11_NO_MITSHM=1
      - MUJOCO_GL=${MUJOCO_GL:-glfw}
      - MESA_GL_VERSION_OVERRIDE=4.6
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - USE_SIM_TIME=true
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=patrol_db
      - DB_USER=admin
      - DB_PASS=password123

    networks:
      - patrol_network

  # ===========================================================================
  # ROBOT CORE
  #   - robot_viewer
  # 실행
  #   - docker compose up robot_viewer
  #   - docker compose exec robot_viewer bash
  # ===========================================================================

  robot_viewer:
    build:
      context: .
      target: robot
    container_name: safety_patrol_robot_viewer
    stdin_open: true
    tty: true
    ipc: host

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspace/ros2_ws/install/setup.bash &&
      ros2 launch /workspace/launch/robot_state_publisher.launch.py &
      python3 /workspace/scripts/twist_mux_node.py --ros-args -p use_sim_time:=true &
      python3 /workspace/scripts/mujoco_ros2_bridge_viewer.py &
      wait"

    volumes:
      - ./models:/workspace/models
      - ./worlds:/workspace/worlds
      - ./scenes:/workspace/scenes
      - ./scripts:/workspace/scripts
      - ./config:/workspace/config
      - ./maps:/workspace/maps
      - ./data:/workspace/data
      - ./results:/workspace/results
      - ./datasets:/workspace/datasets
      - ./ros2_ws:/workspace/ros2_ws
      - ./urdf:/workspace/urdf
      - ./launch:/workspace/launch

    environment:
      - DISPLAY=host.docker.internal:0.0
      - LIBGL_ALWAYS_SOFTWARE=0
      - QT_X11_NO_MITSHM=1
      - MUJOCO_GL=${MUJOCO_GL:-glfw}
      - MESA_GL_VERSION_OVERRIDE=4.6
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - USE_SIM_TIME=true
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=patrol_db
      - DB_USER=admin
      - DB_PASS=password123

    networks:
      - patrol_network

  # ===========================================================================
  # RVIZ + SLAM
  #   - docker compose up rviz_slam
  # ===========================================================================

  rviz_slam:
    build:
      context: .
      target: robot
    container_name: safety_patrol_rviz_slam

    profiles:
      - slam

    stdin_open: true
    tty: true

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspace/ros2_ws/install/setup.bash &&
      ros2 launch slam_toolbox online_async_launch.py
      slam_params_file:=/workspace/config/slam_toolbox_factory.yaml &
      ros2 run rviz2 rviz2
      -d /workspace/config/nav2_default_view.rviz
      --ros-args
      -p use_sim_time:=true"

    volumes:
      - ./config:/workspace/config
      - ./maps:/workspace/maps
      - ./ros2_ws:/workspace/ros2_ws
      - /tmp/.X11-unix:/tmp/.X11-unix

    environment:
      - DISPLAY=host.docker.internal:0.0
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # RVIZ + NAV2
  #   - docker compose up rviz_nav2
  # ===========================================================================

  rviz_nav2:
    build:
      context: .
      target: robot
    container_name: safety_patrol_rviz_nav2

    profiles:
      - nav2

    stdin_open: true
    tty: true

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      ros2 launch nav2_bringup bringup_launch.py \
      use_sim_time:=true \
      autostart:=true \
      map:=/workspace/maps/factory_map.yaml \
      params_file:=/workspace/config/nav2_params.yaml \
      cmd_vel_topic:=/cmd_vel_nav &
      ros2 run rviz2 rviz2 \
      -d /workspace/config/nav2_default_view.rviz \
      --ros-args \
      -p use_sim_time:=true"

    volumes:
      - ./config:/workspace/config
      - ./maps:/workspace/maps
      - /tmp/.X11-unix:/tmp/.X11-unix

    environment:
      - DISPLAY=host.docker.internal:0.0
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_GL_VERSION_OVERRIDE=3.3
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # TELEOP
  #   - docker compose run --rm teleop
  # ===========================================================================

  teleop:
    build:
      context: .
      target: robot
    container_name: safety_patrol_teleop

    profiles:
      - teleop

    stdin_open: true
    tty: true

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      ros2 run teleop_twist_keyboard teleop_twist_keyboard
      --ros-args
      -r cmd_vel:=/cmd_vel_teleop"

    environment:
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # AUTO EXPLORE + MAP SAVER
  #   - docker compose run --rm auto_explore_map
  # ===========================================================================

  auto_explore_map:
    build:
      context: .
      target: robot
    container_name: safety_patrol_auto_explore_map

    profiles:
      - slam

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      python3 /workspace/scripts/auto_explore_for_mapping.py
      --ros-args
      -p use_sim_time:=true &&
      python3 /workspace/scripts/save_factory_map.py
      --output /workspace/maps/factory_map"

    volumes:
      - ./scripts:/workspace/scripts
      - ./maps:/workspace/maps

    environment:
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # PERCEPTION SAFETY
  #   - docker compose up perception_safety
  # ===========================================================================

  perception_safety:
    build:
      context: .
      target: robot
    container_name: safety_patrol_perception

    profiles:
      - vision

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspace/ros2_ws/install/setup.bash &&
      ros2 launch perception_safety_pkg safety_pipeline.launch.py"

    volumes:
      - ./ros2_ws:/workspace/ros2_ws
      - ./config:/workspace/config
      - ./models:/workspace/models

    environment:
      - DISPLAY=host.docker.internal:0.0
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=offscreen
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # FALL DETECTION
  #   - docker compose up fall_detection
  # ===========================================================================

  fall_detection:
    build:
      context: .
      target: robot
    container_name: safety_patrol_fall_detection

    profiles:
      - vision
      - fall

    stdin_open: true
    tty: true

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspace/ros2_ws/install/setup.bash &&
      python3 /workspace/scripts/fall_detection_node.py"

    volumes:
      - ./scripts:/workspace/scripts
      - ./ros2_ws:/workspace/ros2_ws
      - ./config:/workspace/config
      - ./models:/workspace/models

    environment:
      - DISPLAY=host.docker.internal:0.0
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=offscreen
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # FIRE DETECTION
  #   - docker compose up fire_detection
  # ===========================================================================

  fire_detection:
    build:
      context: .
      target: robot
    container_name: safety_patrol_fire_detection

    profiles:
      - vision
      - fire

    stdin_open: true
    tty: true

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspace/ros2_ws/install/setup.bash &&
      ros2 launch fire_detection_pkg fire_pipeline.launch.py"

    volumes:
      - ./ros2_ws:/workspace/ros2_ws
      - ./config:/workspace/config
      - ./models:/workspace/models

    environment:
      - DISPLAY=host.docker.internal:0.0
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # DATABASE
  # ===========================================================================

  db:
    build:
      context: .
      target: db
    container_name: patrol_database

    environment:
      POSTGRES_DB: patrol_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - patrol_network


  # ===========================================================================
  # EVENT LOGGER
  #   ROS2 이벤트(TTC, PPE)를 SQLite/PostgreSQL에 저장
  #   - docker compose up event_logger
  # ===========================================================================

  event_logger:
    build:
      context: .
      target: robot
    container_name: safety_event_logger

    profiles:
      - vision
      - logger

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspace/ros2_ws/install/setup.bash &&
      ros2 launch event_logger_pkg event_logger.launch.py"

    volumes:
      - ./ros2_ws:/workspace/ros2_ws
      - ./data:/workspace/data

    environment:
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=patrol_db
      - DB_USER=admin
      - DB_PASS=password123

    depends_on:
      - db

    networks:
      - patrol_network


  # ===========================================================================
  # WEBSOCKET BRIDGE
  #   ROS2 토픽 → WebSocket 브리지 (포트 8765)
  #   - docker compose up ws_bridge
  # ===========================================================================

  ws_bridge:
    build:
      context: .
      target: robot
    container_name: safety_ws_bridge

    profiles:
      - vision
      - dashboard

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspace/ros2_ws/install/setup.bash &&
      python3 /workspace/dashboard/ws_bridge.py"

    volumes:
      - ./ros2_ws:/workspace/ros2_ws
      - ./dashboard:/workspace/dashboard

    ports:
      - "8765:8765"

    environment:
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - WS_HOST=0.0.0.0
      - WS_PORT=8765

    networks:
      - patrol_network


  # ===========================================================================
  # DASHBOARD (nginx static file server)
  #   React 단일 파일 대시보드 (포트 8080)
  #   - docker compose up dashboard
  #   - 브라우저: http://localhost:8080
  # ===========================================================================

  dashboard:
    build:
      context: .
      target: dashboard
    container_name: safety_dashboard

    ports:
      - "8080:80"

    depends_on:
      - ws_bridge

    networks:
      - patrol_network


# =============================================================================
# NETWORK
# =============================================================================

networks:
  patrol_network:
    driver: bridge


# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres_data: