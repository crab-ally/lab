version: "3.8"

services:

  # ===========================================================================
  # ROBOT CORE
  #   - robot_sim
  #   - robot_state_publisher
  #   - twist_mux
  # 실행
  #   - docker compose up robot
  # ===========================================================================

  robot:
    build:
      context: .
      target: robot
    container_name: safety_patrol_robot
    stdin_open: true
    tty: true
    ipc: host

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspace/ros2_ws/install/setup.bash &&
      ros2 launch /workspace/launch/robot_state_publisher.launch.py &
      python3 /workspace/scripts/twist_mux_node.py &
      python3 /workspace/scripts/mujoco_ros2_bridge.py &
      wait"

    volumes:
      - ./models:/workspace/models
      - ./worlds:/workspace/worlds
      - ./scenes:/workspace/scenes
      - ./scripts:/workspace/scripts
      - ./config:/workspace/config
      - ./maps:/workspace/maps
      - ./data:/workspace/data
      - ./results:/workspace/results
      - ./datasets:/workspace/datasets
      - ./ros2_ws:/workspace/ros2_ws
      - ./urdf:/workspace/urdf
      - ./launch:/workspace/launch

    environment:
      - DISPLAY=host.docker.internal:0.0
      - LIBGL_ALWAYS_SOFTWARE=0
      - QT_X11_NO_MITSHM=1
      - MUJOCO_GL=${MUJOCO_GL:-glfw}
      - MESA_GL_VERSION_OVERRIDE=4.6
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - USE_SIM_TIME=true
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=patrol_db
      - DB_USER=admin
      - DB_PASS=password123

    networks:
      - patrol_network


  # ===========================================================================
  # RVIZ 실행
  #   - docker compose up rviz
  # ===========================================================================

  rviz:
    build:
      context: .
      target: robot
    container_name: safety_patrol_rviz

    profiles:
      - rviz

    stdin_open: true
    tty: true

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      ros2 run rviz2 rviz2
      -d /workspace/config/nav2_default_view.rviz
      --ros-args
      -p use_sim_time:=true"

    volumes:
      - ./config:/workspace/config
      - /tmp/.X11-unix:/tmp/.X11-unix

    environment:
      - DISPLAY=host.docker.internal:0.0
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # SLAM 실행
  #   - docker compose up slam
  # ===========================================================================

  slam:
    build:
      context: .
      target: robot
    container_name: safety_patrol_slam

    profiles:
      - slam

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      ros2 launch slam_toolbox online_async_launch.py
      slam_params_file:=/workspace/config/slam_toolbox_factory.yaml"

    volumes:
      - ./config:/workspace/config
      - ./maps:/workspace/maps

    environment:
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # NAV2 실행
  #   - docker compose up nav2
  # ===========================================================================

  nav2:
    build:
      context: .
      target: robot
    container_name: safety_patrol_nav2

    profiles:
      - nav2

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      ros2 launch nav2_bringup bringup_launch.py
      use_sim_time:=true
      autostart:=true
      map:=/workspace/maps/factory_map.yaml
      params_file:=/workspace/config/nav2_params.yaml
      --ros-args
      -r cmd_vel:=/cmd_vel_nav"

    volumes:
      - ./config:/workspace/config
      - ./maps:/workspace/maps

    environment:
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # TELEOP 실행
  #   - docker compose run --rm teleop
  # ===========================================================================

  teleop:
    build:
      context: .
      target: robot
    container_name: safety_patrol_teleop

    profiles:
      - teleop

    stdin_open: true
    tty: true

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      ros2 run teleop_twist_keyboard teleop_twist_keyboard
      --ros-args
      -r cmd_vel:=/cmd_vel_teleop"

    environment:
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # AUTO EXPLORE 실행
  #   - docker compose run --rm auto_explore
  # ===========================================================================

  auto_explore:
    build:
      context: .
      target: robot
    container_name: safety_patrol_auto_explore

    profiles:
      - slam

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      python3 /workspace/scripts/auto_explore_for_mapping.py
      --ros-args
      -p use_sim_time:=true"

    volumes:
      - ./scripts:/workspace/scripts

    environment:
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # MAP SAVER 실행
  #   - docker compose run --rm map_saver
  # ===========================================================================

  map_saver:
    build:
      context: .
      target: robot
    container_name: safety_patrol_map_saver

    profiles:
      - slam

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      python3 /workspace/scripts/save_factory_map.py
      --output /workspace/maps/factory_map"

    volumes:
      - ./maps:/workspace/maps
      - ./scripts:/workspace/scripts

    environment:
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # PERCEPTION SAFETY 실행
  #   - docker compose up perception_safety
  # ===========================================================================

  perception_safety:
    build:
      context: .
      target: robot
    container_name: safety_patrol_perception

    profiles:
      - vision

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspace/ros2_ws/install/setup.bash &&
      ros2 launch perception_safety_pkg safety_pipeline.launch.py"

    volumes:
      - ./ros2_ws:/workspace/ros2_ws
      - ./config:/workspace/config
      - ./models:/workspace/models

    environment:
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # FIRE DETECTION 실행
  #   - docker compose up fire_detection
  # ===========================================================================

  fire_detection:
    build:
      context: .
      target: robot
    container_name: safety_patrol_fire_detection

    profiles:
      - vision
      - fire

    stdin_open: true
    tty: true

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspace/ros2_ws/install/setup.bash &&
      ros2 launch fire_detection_pkg fire_pipeline.launch.py"

    volumes:
      - ./ros2_ws:/workspace/ros2_ws
      - ./config:/workspace/config
      - ./models:/workspace/models

    environment:
      - DISPLAY=host.docker.internal:0.0
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    networks:
      - patrol_network


  # ===========================================================================
  # DATABASE
  # ===========================================================================

  db:
    build:
      context: .
      target: db
    container_name: patrol_database

    environment:
      POSTGRES_DB: patrol_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - patrol_network


  # ===========================================================================
  # DASHBOARD
  # ===========================================================================

  dashboard:
    build:
      context: .
      target: dashboard
    container_name: safety_dashboard

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    depends_on:
      - db

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - patrol_network


# =============================================================================
# NETWORK
# =============================================================================

networks:
  patrol_network:
    driver: bridge


# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres_data:
  grafana_data: