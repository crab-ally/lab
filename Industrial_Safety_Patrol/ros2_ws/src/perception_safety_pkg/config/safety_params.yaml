perception_node:
  ros__parameters:
    model_path: "/workspace/models/ppe_forklift_yolov8n/best.pt"
    conf_threshold: 0.5
    target_classes: [0, 1, 2, 3] # 0: person, 1: helmet, 2: vest, 3: forklift

fusion_node_3d:
  ros__parameters:
    target_frame: "base_link"

ttc_node:
  ros__parameters:
    warning_ttc: 3.0
    emergency_ttc: 1.5
    robot_radius: 0.5
    slowdown_factor: 0.5

twist_mux_node:
  ros__parameters:
    cmd_timeout: 0.5
    slowdown_ratio: 0.5