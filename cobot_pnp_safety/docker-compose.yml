version: '3.8'

services:
  # 1. MuJoCo 브릿지 + MoveIt 2 (MoveGroup & RSP) 백엔드 컨테이너
  mujoco_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panda_mujoco_backend
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0.0}
      - ROS_DOMAIN_ID=50
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    # Launch 파일로 MoveIt2 move_group + robot_state_publisher와 MuJoCo bridge를 동시 실행
    command: >
      bash -c "
      ros2 launch /workspace/launch/panda_moveit.launch.py &
      python3 scripts/mujoco_ros2_bridge.py &
      wait"

  # 2. RViz2 시각화 전용 독립 컨테이너
  rviz:
    profiles: ["rviz"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panda_rviz
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0.0}
      - ROS_DOMAIN_ID=50
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: rviz2 -d /workspace/config/panda.rviz