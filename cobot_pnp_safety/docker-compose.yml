services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panda_ros2
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=host.docker.internal:0.0
      - ROS_DOMAIN_ID=50
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: bash

  rviz:
    profiles: ["rviz"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panda_rviz
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=host.docker.internal:0.0
      - ROS_DOMAIN_ID=50
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: rviz2 -d /workspace/config/panda.rviz