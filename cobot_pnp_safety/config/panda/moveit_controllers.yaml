moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - panda_arm_controller
    - panda_hand_controller

  panda_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7

  panda_hand_controller:
    type: GripperCommand
    action_ns: gripper_action
    default: true
    joints:
      - finger_joint1

trajectory_execution:
  allowed_execution_duration_scaling: 2.0     # 시뮬레이션 지연 고려 실행 시간 2배 허용
  allowed_goal_duration_margin: 1.0           # 마진 시간 추가 (초)
  execution_duration_monitoring: false        # 시뮬레이션 루프 속도 차이로 인한 CONTROL_FAILED 방지